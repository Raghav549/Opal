<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#f5f2ea" />
<meta name="description" content="OPAL — a refined digital atelier for loose diamonds and exceptional gemstones." />
<title>OPAL — Loose Stones</title>
</head>
<body style="margin:0;background:#f5f2ea;color:#171716">
<div id="root" style="min-height:100vh;background:#f5f2ea">
  <section id="opal-static-home" style="min-height:100vh;background:#f5f2ea;color:#171716;font-family:Arial,sans-serif">
    <div style="height:64px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #dedbd4;background:#fff">
      <div style="font:italic 28px Georgia,serif">Opal</div>
      <div style="font-size:9px;letter-spacing:.18em;color:#777">LOOSE STONES</div>
    </div>
    <div style="min-height:calc(100vh - 64px);position:relative;overflow:hidden;background:#171716">
      <video autoplay muted loop playsinline preload="metadata" poster="https://res.cloudinary.com/wholetv/image/upload/v1790069674/wvvcl7fyntc9uewwoe3z.webp" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.82">
        <source src="https://res.cloudinary.com/wholetv/video/upload/q_auto:good,vc_auto/v1790087679/bxtfxreuil7llicuzmhe.mp4" type="video/mp4">
      </video>
      <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.48));pointer-events:none"></div>
      <div style="position:absolute;left:6vw;right:6vw;bottom:30px;color:#fff;display:flex;align-items:end;justify-content:space-between;gap:20px">
        <div>
          <div style="font-size:9px;letter-spacing:.25em;margin-bottom:10px">A DIGITAL STONE HOUSE</div>
          <div style="font:400 clamp(46px,9vw,92px)/.88 Georgia,serif;letter-spacing:-.05em">Opal</div>
          <div style="font-size:11px;color:#ddd;margin-top:14px">Loose stones, documented with care.</div>
        </div>
        <a href="#categories" style="display:inline-block;background:#fff;color:#171716;text-decoration:none;border-radius:12px;padding:13px 18px;font-size:9px;letter-spacing:.16em;white-space:nowrap">EXPLORE</a>
      </div>
    </div>
    <div id="opal-static-status" style="padding:14px 18px;text-align:center;background:#f5f2ea;color:#888;font-size:9px;letter-spacing:.08em">Opening the collection…</div>
  </section>
  <div id="opal-app"></div>
</div>
<script>
(function(){
  var root=document.getElementById('root');
  var show=function(title,detail){
    var status=document.getElementById('opal-static-status');
    if(status){status.textContent=title+' — '+detail;status.style.color='#7d6a58';}
  };
  window.addEventListener('error',function(e){
    console.error('OPAL_EARLY_ERROR',e.error||e.message);
    show('Startup error','interactive mode stopped; static collection remains visible');
  });
  window.addEventListener('unhandledrejection',function(e){
    console.error('OPAL_EARLY_REJECTION',e.reason);
    show('Startup error','interactive mode stopped; static collection remains visible');
  });
})();
</script>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
